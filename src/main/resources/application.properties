# Configuracion del servidor
server.port=8080

# CONFIGURACIÓN DE BASE DE DATOS MYSQL

# 1. URL de Conexión (Con la solución al error Public Key)
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_el_sol?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Credenciales de MySQL (CORREGIDA LA CONTRASEÑA EN MAYÚSCULAS)
spring.datasource.username=root
spring.datasource.password=SONIAs1234*

# 3. Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true 

# SOLUCIÓN AL ERROR DE DIALECTO
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect