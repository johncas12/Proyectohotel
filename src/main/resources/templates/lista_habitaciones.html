<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Habitaciones</title>
    <link rel="stylesheet" th:href="@{/css/lista-habitaciones.css}">
</head>
<body>
<div class="container">
    <h1>Lista de Habitaciones</h1>
    <a th:href="@{/habitaciones/formulario}" class="btn-nueva">+ Nueva habitación</a>
    <table>
        <thead>
            <tr>
                <th>Número</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Capacidad</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="habitacion : ${habitaciones}">
                <td th:text="${habitacion.numeroHabitacion}"></td>
                <td th:text="${habitacion.tipo}"></td>
                <td th:text="${habitacion.estado}"></td>
                <td th:text="${habitacion.capacidad}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(habitacion.precioNoche, 1, 'POINT', 2, 'POINT')}"></td>
                <td>
                    <a th:href="@{'/habitaciones/editar/' + ${habitacion.idHabitacion}}">Editar</a>
                    <a th:href="@{'/habitaciones/eliminar/' + ${habitacion.idHabitacion}}"
                       onclick="return confirm('¿Eliminar esta habitación?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
