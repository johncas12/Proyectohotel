<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear/Editar Reserva</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="container">
        <h1>Hotel El Sol</h1>
        <h2 th:text="${reserva.idReserva == null ? 'Crear Nueva Reserva' : 'Editar Reserva ID: ' + reserva.idReserva}">Formulario de Reserva</h2>

        <form th:action="@{/reservas/guardar}" th:object="${reserva}" method="post">
            <input type="hidden" th:field="*{idReserva}" /> 

            <div class="form-group">
                <label for="usuario">Usuario *</label>
                <select id="usuario" th:field="*{usuario}" required class="form-control">
                    <option value="">Seleccione un usuario</option>
                    <option th:each="u : ${usuarios}" 
                            th:value="${u.id}" 
                            th:text="${u.nombre + ' ' + u.apellido + ' (' + u.email + ')'}">
                        Nombre Apellido (email)
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="habitacion">Habitación *</label>
                <select id="habitacion" th:field="*{habitacion}" required class="form-control">
                    <option value="">Seleccione una habitación</option>
                    <option th:each="h : ${habitaciones}" 
                            th:value="${h.idHabitacion}" 
                            th:text="${h.numeroHabitacion + ' - ' + h.tipoHabitacion.nombreTipo}">
                        101 - Estándar
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaCheckin">Fecha de Check-in *</label>
                <input type="date" id="fechaCheckin" th:field="*{fechaCheckin}" required class="form-control">
            </div>
            
            <div class="form-group">
                <label for="fechaCheckout">Fecha de Check-out *</label>
                <input type="date" id="fechaCheckout" th:field="*{fechaCheckout}" required class="form-control">
            </div>

            <div class="form-group">
                <label for="totalHuespedes">Total de Huéspedes *</label>
                <input type="number" id="totalHuespedes" th:field="*{totalHuespedes}" min="1" required class="form-control">
            </div>
            
            <div class="form-group">
                <label for="estadoReserva">Estado de la Reserva</label>
                <select id="estadoReserva" th:field="*{estadoReserva}" class="form-control">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Confirmada">Confirmada</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar Reserva</button>
            <a th:href="@{/reservas}" class="btn btn-danger">Cancelar</a>
        </form>
    </div>
</body>
</html>
