<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="container">
        <h1>Hotel El Sol</h1>
        <h2 th:text="${usuario.id == null ? 'Registrar Nuevo Usuario' : 'Editar Usuario ID: ' + usuario.id}">Formulario de Usuario</h2>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}" /> 
            
            <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>
            
            <div class="form-group">
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" th:field="*{apellido}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label for="passwordHash">Contraseña (Solo si edita/crea)</label>
                <input type="password" id="passwordHash" th:field="*{passwordHash}">
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" th:field="*{telefono}">
            </div>
            
            <div class="form-group">
                <label for="tipoUsuario">Tipo de Usuario</label>
                <select id="tipoUsuario" th:field="*{tipoUsuario}">
                    <option value="cliente">Cliente</option>
                    <option value="admin">Administrador</option>
                    <option value="moderador">Moderador</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar Usuario</button>
            <a th:href="@{/usuarios}" class="btn btn-danger">Cancelar</a>
        </form>
    </div>
</body>
</html>
