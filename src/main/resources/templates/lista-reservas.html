<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Reservas</title>
    <link rel="stylesheet" th:href="@{/css/lista-reservas.css}">
</head>
<body>
<div class="container">
    <h1>Reservas registradas</h1>

    <!-- Botón para crear nueva reserva -->
    <a th:href="@{/reservas/formulario}" class="btn btn-primary">Crear nueva reserva</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Habitación</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reserva : ${reservas}">
                <td th:text="${reserva.idReserva}"></td>
                <td th:text="${reserva.usuario.nombre + ' ' + reserva.usuario.apellido}"></td>
                <td th:text="${reserva.habitacion.numeroHabitacion}"></td>
                <td th:text="${#dates.format(reserva.fechaCheckin, 'dd/MM/yyyy')}"></td>
                <td th:text="${#dates.format(reserva.fechaCheckout, 'dd/MM/yyyy')}"></td>
                <td th:text="${reserva.estadoReserva}"></td>
                <td>
                    <a th:href="@{'/reservas/editar/' + ${reserva.idReserva}}" class="btn btn-warning">Editar</a>
                    <a th:href="@{'/reservas/eliminar/' + ${reserva.idReserva}}" class="btn btn-danger"
                       onclick="return confirm('¿Estás segura de que deseas eliminar esta reserva?');">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
