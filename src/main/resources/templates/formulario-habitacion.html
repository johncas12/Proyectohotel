<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Habitación</title>
    <link rel="stylesheet" th:href="@{/css/formulario-habitacion.css}">
</head>
<body>
<div class="container">
    <h1>Formulario de Habitación</h1>
    <form th:action="@{/habitaciones/guardar}" th:object="${habitacion}" method="post">
        <label>Número de habitación:</label>
        <input type="text" th:field="*{numeroHabitacion}" required />

        <label>Tipo:</label>
        <select th:field="*{tipo}" required>
            <option value="">Seleccione un tipo</option>
            <option value="Individual">Individual</option>
            <option value="Doble">Doble</option>
            <option value="Suite">Suite</option>
        </select>

        <label>Estado:</label>
        <select th:field="*{estado}" required>
            <option value="disponible">Disponible</option>
            <option value="ocupada">Ocupada</option>
            <option value="mantenimiento">Mantenimiento</option>
        </select>

        <label>Capacidad:</label>
        <input type="number" th:field="*{capacidad}" required />

        <label>Precio por noche:</label>
        <input type="number" step="0.01" th:field="*{precioNoche}" required />

        <button type="submit">Guardar</button>
    </form>
</div>
</body>
</html>
