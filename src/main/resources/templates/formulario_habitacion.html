<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Habitación</title>
    <link rel="stylesheet" th:href="@{/css/formulario-habitacion.css}">
</head>
<body>
<div class="container">
    <h1>Formulario de Habitación</h1>
    <form th:action="@{/habitaciones/guardar}" th:object="${habitacion}" method="post">
        <input type="hidden" th:field="*{idHabitacion}" />
        <label for="numeroHabitacion">Número de habitación:</label>
        <input type="text" id="numeroHabitacion" th:field="*{numeroHabitacion}" required />

        <label for="tipo">Tipo:</label>
        <select id="tipo" th:field="*{tipo}" required>
            <option value="">Seleccione un tipo</option>
            <option value="Individual">Individual</option>
            <option value="Doble">Doble</option>
            <option value="Suite">Suite</option>
        </select>

        <label for="estado">Estado:</label>
        <select id="estado" th:field="*{estado}" required>
            <option value="">Seleccione estado</option>
            <option value="disponible">Disponible</option>
            <option value="ocupada">Ocupada</option>
            <option value="mantenimiento">Mantenimiento</option>
        </select>

        <label for="capacidad">Capacidad:</label>
        <input type="number" id="capacidad" th:field="*{capacidad}" min="1" required />

        <label for="precioNoche">Precio por noche:</label>
        <input type="number" id="precioNoche" th:field="*{precioNoche}" step="0.01" min="0" required />

        <button type="submit">Guardar</button>
    </form>
</div>
</body>
</html>
